
# Primary system (online): postgres, redis, pulsar, backend, ledger-worker, integrity
# Public bulletin board: bulletin
# Air-gapped forensic replica: replica — attached ONLY to the "diode" network,
# where it can reach the ledger broker (read-only subscription) and the bulletin
# board, but not the primary's Redis, PostgreSQL or API.

x-backend-image: &backend-image
  build:
    context: ./backend
    dockerfile: Dockerfile
  volumes:
    - ./backend:/app

services:

  postgres:
    image: postgres:15-alpine
    container_name: evoting_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: evoting
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d evoting"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: evoting_redis
    command: redis-server --maxmemory 1gb --maxmemory-policy noeviction --save ""
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  bulletin:
    image: redis:7-alpine
    container_name: evoting_bulletin
    command: redis-server --maxmemory 512mb --maxmemory-policy noeviction --appendonly yes
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [default, diode]
    restart: unless-stopped

  pulsar:
    image: apachepulsar/pulsar:3.1.0
    container_name: evoting_pulsar
    command: bin/pulsar standalone
    environment:
      PULSAR_MEM: "-Xms1g -Xmx3g"
    ports:
      - "6650:6650"
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/admin/v2/clusters || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
    networks: [default, diode]
    restart: unless-stopped

  backend:
    <<: *backend-image
    container_name: evoting_backend
    # Production mode: WORKERS uvicorn workers (default: one per CPU core).
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers $${WORKERS:-$$(nproc)}"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/evoting
      REDIS_URL: redis://redis:6379/0
      BULLETIN_URL: redis://bulletin:6379/0
      PULSAR_URL: pulsar://pulsar:6650
      SECRET_KEY: ${SECRET_KEY}
      JWT_ALGORITHM: HS256
      JWT_EXPIRY_MINUTES: 60
      LIVENESS_NONCE_TTL_SECONDS: 90
      WORKERS: ${WORKERS:-}
      BUNDLE_SIZE: "10000"
      INTEGRITY_INTERVAL: "5"
      LIVENESS_TAU: "15"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bulletin:
        condition: service_healthy
      pulsar:
        condition: service_healthy
    restart: unless-stopped

  ledger-worker:
    <<: *backend-image
    container_name: evoting_ledger_worker
    command: python -m app.workers.ledger_worker
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/evoting
      PULSAR_URL: pulsar://pulsar:6650
    depends_on:
      postgres:
        condition: service_healthy
      pulsar:
        condition: service_healthy
    restart: unless-stopped

  integrity:
    <<: *backend-image
    container_name: evoting_integrity
    command: python -m app.workers.primary_integrity
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/evoting
      PULSAR_URL: pulsar://pulsar:6650
      BULLETIN_URL: redis://bulletin:6379/0
      BUNDLE_SIZE: "10000"
      INTEGRITY_INTERVAL: "5"
    depends_on:
      postgres:
        condition: service_healthy
      bulletin:
        condition: service_healthy
      pulsar:
        condition: service_healthy
    restart: unless-stopped

  replica:
    <<: *backend-image
    container_name: evoting_replica
    command: python -m app.replica.forensic_replica
    environment:
      PULSAR_URL: pulsar://pulsar:6650
      BULLETIN_URL: redis://bulletin:6379/0
      BUNDLE_SIZE: "10000"
      INTEGRITY_INTERVAL: "5"
    networks: [diode]
    depends_on:
      bulletin:
        condition: service_healthy
      pulsar:
        condition: service_healthy
    restart: unless-stopped

networks:
  default: {}
  diode:
    internal: true

volumes:
  postgres_data:
